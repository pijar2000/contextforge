[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextforge"
version = "0.1.0"
description = "Enterprise knowledge ingestion, hybrid retrieval and evaluation platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "polars>=0.20",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "minio>=7.2",
    "qdrant-client>=1.10",
    "opensearch-py>=2.5",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33", "pandas>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
contextforge = "contextforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires running Postgres, MinIO, Qdrant and OpenSearch (docker compose up)",
    "model: requires downloaded sentence-transformers models",
]
addopts = "-m 'not integration and not model'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "dags", "dashboard", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
