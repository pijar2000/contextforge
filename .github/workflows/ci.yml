name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only torch
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit and local integration tests
        env:
          EMBEDDING_BACKEND: hashing
        run: pytest tests/unit tests/integration -m "not integration and not model"

  service-integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
      opensearch:
        image: opensearchproject/opensearch:2.15.0
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev]"
      - name: Qdrant and OpenSearch adapter tests
        env:
          QDRANT_URL: http://localhost:6333
          OPENSEARCH_URL: http://localhost:9200
        run: pytest -m integration tests/integration/test_service_indexes.py
